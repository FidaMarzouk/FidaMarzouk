name: Update profile README

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No PROFILE_TOKEN secret yet, keeping current data"; exit 0; fi
          python scripts/fetch_contributions.py
      - name: Rebuild README and artwork
        run: python build.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet || git commit -m "Update contributions"
          git push
