<g class="fade" style="animation-delay:1.00s"><text x="48" y="366" font-size="14" font-weight="700" letter-spacing="1.5" fill="#59636e">2026</text><rect x="146" y="348" width="8" height="24" rx="2" fill="#1a7f37"/><text x="176" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="23" xml:space="preserve"><tspan fill="#1f2328">RetinaGuard</tspan><tspan fill="#59636e">  ·  Personal research project</tspan><tspan fill="#59636e">  ·  Oct – Nov</tspan></text><text x="176" y="398" font-size="16" fill="#1f2328" fill-opacity=".86">End-to-end triage for retinal fundus photos: retake · refer · no refer · defer to a human, with U-Net lesion maps</text><text x="176" y="423" font-size="16" fill="#59636e">Dagster + DVC pipeline over 4 datasets · ConvNeXt, EfficientNet, DINOv2 · AUROC 0.97 external · ONNX + FastAPI</text></g>
