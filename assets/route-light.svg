<g class="fade" style="animation-delay:1.24s"><text x="48" y="590" font-size="14" font-weight="700" letter-spacing="1.5" fill="#59636e">2026</text><rect x="146" y="572" width="8" height="24" rx="2" fill="#1a7f37"/><text x="176" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="23" xml:space="preserve"><tspan fill="#1f2328">Lumina</tspan><tspan fill="#59636e">  ·  AI mental health companion</tspan><tspan fill="#59636e">  ·  IHEC · May – Jun</tspan></text><text x="176" y="622" font-size="16" fill="#1f2328" fill-opacity=".86">Layered safety screening: rules · RoBERTa · Llama Guard 3 · LLM risk reader, reaching 97% crisis recall</text><text x="176" y="647" font-size="16" fill="#59636e">Intent classifier on agreement-filtered LLM labels · intent- and emotion-aware RAG dialogue over clinical sources</text></g>
